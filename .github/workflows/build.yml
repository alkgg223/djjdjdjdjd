name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: realweather
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: realweather-jar
          path: realweather/build/libs/*.jar

  # The jar is printed in four parts, one job each, so that no single log is too large to read back.
  deliver:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: realweather-jar
      - name: Print jar part ${{ matrix.part }} of 4
        run: |
          f=$(ls *.jar | grep -v -e sources -e javadoc | head -1)
          echo "JAR $(basename "$f") $(sha256sum "$f" | cut -c1-64)"
          base64 -w 0 "$f" | fold -w 50000 > b64.txt
          n=$(wc -l < b64.txt)
          per=$(( (n + 3) / 4 ))
          from=$(( (${{ matrix.part }} - 1) * per + 1 ))
          to=$(( ${{ matrix.part }} * per ))
          echo "PART ${{ matrix.part }} 4 $from $to $n"
          sed -n "${from},${to}p" b64.txt | sed 's/^/B64 /'

  selftest:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[selftest]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils >/dev/null
      - name: In-game self test
        working-directory: realweather
        run: bash tools/selftest.sh

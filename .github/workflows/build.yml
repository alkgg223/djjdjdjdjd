name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: realweather
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Dump reference (temporary)
        if: always()
        working-directory: realweather
        run: bash tools/dump.sh
      - uses: actions/upload-artifact@v4
        with:
          name: realweather-jar
          path: realweather/build/libs/*.jar

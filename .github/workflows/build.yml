name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: realweather
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: realweather-jar
          path: realweather/build/libs/*.jar
      - name: Print jar for delivery
        if: github.event_name == 'workflow_dispatch'
        working-directory: realweather
        run: |
          f=$(ls build/libs/*.jar | head -1)
          echo "JAR $(basename "$f") $(sha256sum "$f" | cut -c1-64)"
          base64 -w 0 "$f" | fold -w 50000 | sed 's/^/B64 /'

  selftest:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[selftest]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils >/dev/null
      - name: In-game self test
        working-directory: realweather
        run: bash tools/selftest.sh

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.21.1'
group = 'com.arkragnarok'

base {
    archivesName = 'ARK_Ragnarok_Ultimate'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

dependencies {
    // GeckoLib drives the skeleton and the keyframe animations; it is packed inside our jar (jar-in-jar)
    jarJar(implementation("software.bernie.geckolib:geckolib-neoforge-1.21.1")) {
        version {
            strictly '[4.9.3,4.10)'
            prefer '4.9.3'
        }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // dedicated server that runs the built-in self test (see com.arkragnarok.test.SmokeTest) and stops
        smoke {
            server()
            gameDirectory = project.file('run-smoke')
            systemProperty 'ark.smoketest', 'true'
            programArgument '--nogui'
        }
        // real client that loads the CI world and takes screenshots of the Rex (see client.test.ShotDirector)
        shots {
            client()
            gameDirectory = project.file('run-shots')
            systemProperty 'ark.shots', 'true'
            programArgument '--quickPlaySingleplayer'
            programArgument 'arkshot'
            programArgument '--width'
            programArgument '1600'
            programArgument '--height'
            programArgument '900'
        }
    }
    mods {
        arkragnarok {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '3000' << '-Xlint:-removal'
}

tasks.named('processResources', ProcessResources) {
    def props = [mod_version: project.mod_version, neo_version: project.neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.named('jar', Jar) {
    archiveFileName = 'ARK_Ragnarok_Ultimate-1.21.1.jar'
    manifest {
        attributes('Implementation-Title': 'ARK Ragnarok Ultimate', 'Implementation-Version': project.mod_version)
    }
}

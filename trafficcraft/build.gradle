plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = 'com.trafficcraft'

base { archivesName = 'trafficcraft' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenLocal() }

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
            if (project.hasProperty('autotest')) {
                systemProperty 'trafficcraft.autotest', 'true'
                systemProperty 'trafficcraft.autotest.mode', project.property('autotest').toString()
                if (project.hasProperty('cars')) systemProperty 'trafficcraft.cars', project.property('cars').toString()
                programArguments.addAll('--quickPlaySingleplayer', project.property('autotest').toString() == 'town' ? 'town' : 'test', '--width', '1280', '--height', '720')
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (project.hasProperty('servertest')) {
                systemProperty 'trafficcraft.servertest', 'true'
                systemProperty 'trafficcraft.servertest.ticks', project.property('servertest').toString()
            }
            gameDirectory = project.file('run-server')
        }
    }
    mods {
        trafficcraft { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-deprecation'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

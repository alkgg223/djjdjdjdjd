plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.8.0'
group = 'com.gunsmod'

base {
    archivesName = 'gunsmod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        gunsmod {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// compares the compiled classes with tools/stubrefs.txt (made from another build of the same sources) when it is there
tasks.register('refCheck', Exec) {
    dependsOn 'classes'
    onlyIf { file('tools/stubrefs.txt').exists() }
    commandLine 'java', 'tools/RefCheck.java', 'build/classes/java/main', 'tools/stubrefs.txt'
    ignoreExitValue = true
}
tasks.named('build') { finalizedBy 'refCheck' }
